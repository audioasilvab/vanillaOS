<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vanillaOS</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/wm.js"></script>
</head>
<body>
  <header class="menubar">
    <div class="menubar-left-buttons">
      <span class="activities">Activities</span>
      <div class="current-app">
        
      </div>
    </div>
    <p class="clock">
      <span class="date">8 May </span>&nbsp;<span class="time">12:12</span>
    </p>
    <div class="menubar-right-buttons">
      <button class="btn-menu btn-wifi-bg" id="wifiBtn" title="Wifi"></button>
      <button class="btn-menu btn-volume-bg" id="volumeBtn" title="Volume"></button>
      <button class="btn-menu btn-shutdown-bg" id="shutdownBtn" title="Shutdown"></button>
    </div>
  </header>
  
  <main>
    <div class="launcher">
      <div class="launcher-apps">
        <div class="launcher__icon">
          <img src="img/terminalIcon.svg" alt="Terminal icon">
        </div>
      </div>
      <div class="menu-launcher__icon">
        <img src="img/dots-menu-icon.svg" alt="Menu icon">
      </div>
    </div>

    <section class="app-menu">
      <div class="app-menu-utilities">
        <div class="menu-searchbox">
          
        </div>
        <img class="app-menu-container-wallpaper" src="../wallpapers/wall02.jpg">
      </div>
      <div class="app-menu-container">
        <div class="app-menu-container-grid">
          
        </div>
      </div>
    </section>

    <section id="desktop" class="desktop">
      <!--<div id="desktop-icons" style="display: grid; grid-template-columns: repeat(auto-fill, 100px); gap: 20px; padding: 20px;"></div>-->
      
    </section>
  </main>
  
  <script>
    // 1. Esta es la función maestra que sabe cómo abrir CUALQUIER app
    async function lanzarApp(app) {
        console.log(`Iniciando: ${app.name}...`);

        try {
            // Importamos el código de la aplicación bajo demanda (Lazy Loading)
            const modulo = await import(app.entry);

            let win_element = window.windowManager.createNewWindow(app.name, {
              path: app.path,
              icon: app.icon
            });

            let win_gui = win_element.querySelector(".window__content");

            modulo.init(win_gui, win_element, { path: app.path });

            // Añadir etiqueta al taskbar
            let launcherApps = document.querySelector(".launcher-apps");
            let launcherIcon = document.createElement('div');
            launcherIcon.className = 'launcher__icon';

            launcherApps.appendChild(launcherIcon) /* NOTA: LO DEJAMOS HASTA AQUI*/


        } catch (error) {
            console.error("Error al cargar el módulo de la app:", error);
        }
    }

    // 2. Función para inicializar el escritorio
    async function inicializarEscritorio() {
        try {
            // Pedimos la lista de apps al servidor
            const respuesta = await fetch('/api/packages');
            const aplicaciones = await respuesta.json();

            // Creamos un contenedor para los iconos si no existe
            const escritorio = document.querySelector('.app-menu-container-grid') || document.body;

            aplicaciones.forEach(app => {
                // Creamos el elemento visual del icono
                const boton = document.createElement('div');
                boton.className = 'app-icon';
                boton.innerHTML = `
                    <img src='${app.path + app.icon}' class="icon-symbol"></div>
                    <div class="icon-label">${app.name}</div>
                `;
                
                // Al hacer click, lanzamos la app usando su objeto de metadatos
                boton.onclick = () => {
                  lanzarApp(app);
                  alternarentreMenuDesktop();
                }
                
                escritorio.appendChild(boton);
            });
        } catch (error) {
            console.error("No se pudo conectar con el servidor de aplicaciones.");
        }
    }

    function alternarentreMenuDesktop() {
      const app_menu = document.querySelector(".app-menu");
      const desktop = document.querySelector(".desktop");

      if (app_menu.style.display === "none") {
        desktop.style.display = "none";
        app_menu.style.display = "flex";
      } else {
        app_menu.style.display = "none";
        desktop.style.display = "flex";
      }
    }

    function initEventListeners() {
        const menu_launcher__icon = document.querySelector(".menu-launcher__icon img");
        menu_launcher__icon.addEventListener("click", alternarentreMenuDesktop);
        alternarentreMenuDesktop();
    }

    // 3. Arrancamos el sistema: Inicializar cuando el DOM esté listo
    document.addEventListener('DOMContentLoaded', function() {
      
      // Inicializar el sistema de ventanas
      window.windowManager = new WindowManager();;

      inicializarEscritorio();

      initEventListeners();
    });
  </script>
</body>

</html>
